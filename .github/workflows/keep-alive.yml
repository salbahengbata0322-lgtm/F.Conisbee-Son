name: Keep Supabase Awake

# Supabase's free tier pauses a project after 7 days with no database activity.
# This workflow pings the project every 3 days so it never goes quiet long
# enough to trigger that — cheap insurance against the site going dead
# mid-season if nobody happens to log in for a week.

on:
  schedule:
    - cron: "0 6 */3 * *"   # 6am UTC, every 3 days
  workflow_dispatch: {}      # lets you also trigger it manually from the Actions tab, to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" \
            "https://itqotgvzqqavarpbmfxl.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0cW90Z3Z6cXFhdmFycGJtZnhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MjI4ODUsImV4cCI6MjEwNjE5ODg4NX0.a_6rcmb1sPzy_OizhWajGiyAbOkIUnK7sysXWROU6p0"
